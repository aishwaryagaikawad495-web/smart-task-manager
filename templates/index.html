<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Smart Task Manager</title>

</head>
<body>

    <!-- Navbar -->

    <nav>

        <div class="logo">
            Smart Task Manager
        </div>

        <div class="nav-links">

    <a href="/">Home</a>

    {% if session.get('user') %}

        <a href="/logout">Logout</a>

    {% else %}

        <a href="/login">Login</a>
        <a href="/register">Register</a>

    {% endif %}

</div>

    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <h1>Manage Your Tasks Efficiently</h1>

        <p>
            Organize your daily work, track progress,
            and stay productive with Smart Task Manager.
        </p>

        <button>Get Started</button>

    </section>

</body>
</html>
